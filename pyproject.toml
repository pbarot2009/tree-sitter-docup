[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-docup"
version = "0.1.0"
description = "tree-sitter grammar for DocUP (.du)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["tree-sitter>=0.25"]

[tool.setuptools]
packages = ["tree_sitter_docup"]

[tool.setuptools.package-dir]
tree_sitter_docup = "bindings/python/tree_sitter_docup"
